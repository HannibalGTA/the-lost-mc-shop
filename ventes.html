<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Ventes — The Lost MC Shop</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏍️</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #080A0E; --dark: #0D1117; --dark2: #141922; --dark3: #1C2333;
            --border: #2A3347; --red: #C8152A; --gold: #C9A84C;
            --text: #E8EDF5; --text-muted: #6B7A99; --text-dim: #3D4F6E;
            --green: #22c55e; --blue: #3b82f6; --purple: #a78bfa;
            --sidebar-w: 260px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--black); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; }

        /* SIDEBAR */
        .sidebar { width: var(--sidebar-w); min-height: 100vh; background: var(--dark2); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; }
        .sidebar-logo { padding: 24px 20px; border-bottom: 1px solid var(--border); text-align: center; }
        .sidebar-title { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 3px; color: var(--text); margin-top: 8px; }
        .sidebar-title span { color: var(--red); }
        .sidebar-nav { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; transition: all 0.15s; text-decoration: none; }
        .nav-item:hover { background: var(--dark3); color: var(--text); }
        .nav-item .icon { font-style: normal; }
        .nav-item.active { background: rgba(200,21,42,0.15); color: var(--text); border-left: 2px solid var(--red); }
        .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
        .nav-badge { margin-left: auto; background: var(--red); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 10px; min-width: 18px; text-align: center; }
        .nav-section { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 2px; color: var(--text-dim); padding: 12px 14px 4px; text-transform: uppercase; }
        .sidebar-bottom { padding: 16px 12px; border-top: 1px solid var(--border); }
        .user-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--dark3); border-radius: 6px; margin-bottom: 8px; }
        .user-avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--red); object-fit: cover; }
        .user-name { font-size: 13px; font-weight: 600; }
        .user-role { font-size: 10px; font-family: 'JetBrains Mono', monospace; color: var(--gold); letter-spacing: 1px; }
        .btn-logout { width: 100%; padding: 8px; background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--text-muted); font-size: 12px; cursor: pointer; transition: all 0.15s; }
        .btn-logout:hover { border-color: var(--red); color: var(--red); }
        .hidden { display: none !important; }

        /* MAIN */
        .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; }
        .topbar { padding: 20px 32px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--dark); position: sticky; top: 0; z-index: 50; }
        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 3px; }

        /* STATS */
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 24px 32px; }
        .stat-card { background: var(--dark2); border: 1px solid var(--border); border-radius: 8px; padding: 16px 20px; }
        .stat-label { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
        .stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 1px; }
        .stat-value.red { color: var(--red); }
        .stat-value.gold { color: var(--gold); }
        .stat-value.green { color: var(--green); }
        .stat-value.blue { color: var(--blue); }

        /* TABS */
        .tabs { display: flex; gap: 4px; padding: 0 32px; }
        .tab { padding: 10px 20px; border-radius: 6px 6px 0 0; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; border: 1px solid transparent; border-bottom: none; transition: all 0.15s; background: transparent; }
        .tab:hover { color: var(--text); background: var(--dark2); }
        .tab.active { color: var(--text); background: var(--dark2); border-color: var(--border); border-bottom: 2px solid var(--red); }

        /* CONTENT */
        .content { background: var(--dark2); border: 1px solid var(--border); border-radius: 0 8px 8px 8px; margin: 0 32px 32px; padding: 24px; min-height: 400px; }

        /* ORDER CARD */
        .order-card { background: var(--dark3); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; overflow: hidden; transition: border-color 0.2s; }
        .order-card:hover { border-color: rgba(200,21,42,0.3); }
        .order-card.new-order { border-color: rgba(200,21,42,0.5); animation: pulse-border 2s ease infinite; }
        @keyframes pulse-border { 0%,100%{border-color:rgba(200,21,42,0.5)} 50%{border-color:rgba(200,21,42,0.9)} }

        .order-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; cursor: pointer; gap: 12px; flex-wrap: wrap; }
        .order-ref { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: var(--red); }
        .order-client { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .order-date { font-size: 11px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
        .order-total { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--green); }

        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; font-family: 'JetBrains Mono', monospace; letter-spacing: 1px; white-space: nowrap; }
        .status-attente { background: rgba(201,168,76,0.15); color: var(--gold); border: 1px solid rgba(201,168,76,0.3); }
        .status-cours { background: rgba(59,130,246,0.15); color: var(--blue); border: 1px solid rgba(59,130,246,0.3); }
        .status-preparee { background: rgba(139,92,246,0.15); color: var(--purple); border: 1px solid rgba(139,92,246,0.3); }
        .status-terminee { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
        .status-annulee { background: rgba(200,21,42,0.15); color: #ff6b7a; border: 1px solid rgba(200,21,42,0.3); }

        .order-body { display: none; border-top: 1px solid var(--border); padding: 20px; }
        .order-body.open { display: block; }

        .order-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
        .order-table th { text-align: left; font-size: 11px; font-weight: 600; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; letter-spacing: 1px; padding: 8px 12px; border-bottom: 1px solid var(--border); text-transform: uppercase; }
        .order-table td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid rgba(42,51,71,0.5); }
        .order-table tr:last-child td { border-bottom: none; }
        .order-table .subtotal { color: var(--green); font-family: 'JetBrains Mono', monospace; text-align: right; }

        /* ACTIONS */
        .order-actions { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 16px; border-top: 1px solid var(--border); align-items: center; justify-content: space-between; }
        .actions-left { display: flex; gap: 8px; flex-wrap: wrap; }
        .actions-right { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

        .btn { padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.15s; border: none; }
        .btn-prendre { background: var(--blue); color: #fff; }
        .btn-prendre:hover { background: #2563eb; }
        .btn-preparee { background: rgba(139,92,246,0.2); color: var(--purple); border: 1px solid rgba(139,92,246,0.4); }
        .btn-preparee:hover { background: rgba(139,92,246,0.35); }
        .btn-livree { background: rgba(34,197,94,0.2); color: var(--green); border: 1px solid rgba(34,197,94,0.4); }
        .btn-livree:hover { background: rgba(34,197,94,0.35); }
        .btn-annuler { background: transparent; border: 1px solid rgba(200,21,42,0.3); color: #ff6b7a; }
        .btn-annuler:hover { background: rgba(200,21,42,0.1); }
        .btn-discord { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: rgba(88,101,242,0.15); border: 1px solid rgba(88,101,242,0.3); border-radius: 6px; color: #7289da; font-size: 12px; font-weight: 600; text-decoration: none; transition: all 0.15s; }
        .btn-discord:hover { background: rgba(88,101,242,0.25); }

        /* MONTANT AJUSTE */
        .montant-row { display: flex; align-items: center; gap: 8px; }
        .montant-input { padding: 7px 12px; background: var(--dark); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 12px; font-family: 'JetBrains Mono', monospace; width: 120px; }
        .montant-input:focus { outline: none; border-color: var(--gold); }
        .btn-montant { background: var(--gold); color: var(--black); font-size: 11px; font-weight: 800; padding: 7px 12px; border-radius: 6px; border: none; cursor: pointer; }
        .btn-montant:hover { opacity: 0.85; }

        /* EMPTY */
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
        .empty-state .emoji { font-size: 48px; margin-bottom: 16px; }

        /* LOADING */
        .loading { display: flex; align-items: center; justify-content: center; padding: 60px; gap: 12px; color: var(--text-muted); font-size: 13px; }
        .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin 0.8s linear infinite; }

        /* TOAST */
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--dark3); border: 1px solid var(--border); border-radius: 8px; padding: 12px 20px; font-size: 13px; color: var(--text); z-index: 500; transition: transform 0.3s ease; white-space: nowrap; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: var(--green); }
        .toast.error { border-color: var(--red); color: #ff6b7a; }

        /* NOTIFICATION SOUND */
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Matériaux modal */
        .mat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
        .mat-item { background: var(--dark3); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
        .mat-nom { font-size: 13px; font-weight: 600; }
        .mat-val { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--green); }

        /* MODAL RÉAFFECTATION / MODIFICATION */
        .modal-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:300;align-items:center;justify-content:center; }
        .modal-overlay.active { display:flex; }
        .modal { background:var(--dark2);border:1px solid var(--border);border-radius:8px;padding:28px;width:90%;max-width:500px;max-height:90vh;overflow-y:auto;position:relative; }
        .modal::before { content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent); }
        .modal-title { font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;margin-bottom:20px; }
        .modal-actions { display:flex;gap:12px;margin-top:20px;justify-content:flex-end; }
        .form-input { padding:10px 12px;background:var(--dark3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;width:100%; }
        .form-input:focus { outline:none;border-color:var(--red); }
        .form-label { font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;font-family:'JetBrains Mono',monospace;display:block;margin-bottom:6px; }
        .article-edit-row { display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:8px 12px;background:var(--dark3);border:1px solid var(--border);border-radius:6px; }
    </style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://dosjkcwitjskydrcmbhj.supabase.co'
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRvc2prY3dpdGpza3lkcmNtYmhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MjM1NTAsImV4cCI6MjEwMDk5OTU1MH0.1QcwS98HHeGjR0bwmBBLb-MpRxS-gO8mZDh0eSDZ740'
const API_URL = 'https://dosjkcwitjskydrcmbhj.supabase.co/functions/v1/lostmc-api'
const GUILD_ID = '1259332285208068179'

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON)
let currentUser = null, accessToken = null, profile = null
let allOrders = [], activeTab = 'disponibles'
let lastPendingCount = -1

async function init() {
    const { data: { session } } = await sb.auth.getSession()
    if (!session) { window.location.href = 'index.html'; return }
    currentUser = session.user
    accessToken = session.access_token
    // Session check - fermeture onglet ou 24h
    if (!sessionStorage.getItem('session_active')) {
        sessionStorage.setItem('session_active', '1')
        sessionStorage.setItem('session_start', Date.now())
    }
    const sessionStart = parseInt(sessionStorage.getItem('session_start') || '0')
    if (sessionStart && Date.now() - sessionStart > 24 * 60 * 60 * 1000) {
        sessionStorage.clear(); await sb.auth.signOut(); window.location.href = 'index.html'; return
    }
    document.getElementById('user-name').textContent = currentUser.user_metadata?.full_name || '—'
    const avatar = currentUser.user_metadata?.avatar_url
    if (avatar) document.getElementById('user-avatar').src = avatar
    await loadProfile()
    await loadOrders()
    setInterval(autoRefresh, 60000)
}

async function callApi(action, payload = {}) {
    const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + accessToken, 'apikey': SUPABASE_ANON },
        body: JSON.stringify({ action, payload })
    })
    const data = await res.json()
    if (data.error) throw new Error(data.error)
    return data
}

function applyProfile(profile) {
    if (!profile.role_vendeur && !profile.role_admin) { window.location.href = 'catalogue.html'; return }
    const role = profile.role_admin ? 'ADMIN' : 'VENDEUR'
    document.getElementById('user-role').textContent = role
    if (profile.role_admin) document.getElementById('nav-admin').classList.remove('hidden')
    else document.getElementById('nav-admin').classList.add('hidden')
}

async function loadProfile() {
    try {
        const cached = sessionStorage.getItem('profile_cache')
        if (cached) {
            const { profile: p, ts } = JSON.parse(cached)
            if (Date.now() - ts < 5 * 60 * 1000) { profile = p; applyProfile(p); return }
        }
        const data = await callApi('get_profile', {})
        profile = data.profile
        sessionStorage.setItem('profile_cache', JSON.stringify({ profile: data.profile, ts: Date.now() }))
        applyProfile(data.profile)
    } catch(e) {
        const{data:prof}=await sb.from('profiles').select('*').eq('id',currentUser.id).maybeSingle()
        if (prof) { profile = prof; applyProfile(prof) }
        else { await sb.auth.signOut(); window.location.href='index.html' }
    }
}

async function loadOrders() {
    const { data } = await sb.from('commandes')
        .select('*, details_commande(*)')
        .order('date_commande', { ascending: false })
    allOrders = data || []
    updateStats()
    checkNewOrders()
    renderOrders()
}

async function autoRefresh() {
    await loadOrders()
}

function updateStats() {
    document.getElementById('stat-attente').textContent = allOrders.filter(o => o.statut === 'En attente').length
    document.getElementById('stat-cours').textContent = allOrders.filter(o => o.statut === 'En cours').length
    document.getElementById('stat-preparee').textContent = allOrders.filter(o => o.statut === 'Préparée').length
    document.getElementById('stat-terminee').textContent = allOrders.filter(o => o.statut === 'Terminée').length
}

function checkNewOrders() {
    const pending = allOrders.filter(o => o.statut === 'En attente' && !o.vendeur_affecte).length
    if (lastPendingCount !== -1 && pending > lastPendingCount) playNotifSound()
    lastPendingCount = pending
}

function playNotifSound() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)()
        const playBeep = (freq, start, dur) => {
            const o = ctx.createOscillator(), g = ctx.createGain()
            o.connect(g); g.connect(ctx.destination)
            o.frequency.value = freq; o.type = 'sine'
            g.gain.setValueAtTime(0, ctx.currentTime + start)
            g.gain.linearRampToValueAtTime(0.3, ctx.currentTime + start + 0.01)
            g.gain.linearRampToValueAtTime(0, ctx.currentTime + start + dur)
            o.start(ctx.currentTime + start); o.stop(ctx.currentTime + start + dur + 0.05)
        }
        playBeep(880, 0, 0.12); playBeep(1100, 0.15, 0.12); playBeep(1320, 0.30, 0.18)
    } catch(e) {}
}

function switchTab(tab) {
    activeTab = tab
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
    document.getElementById('tab-' + tab).classList.add('active')
    renderOrders()
}

function renderOrders() {
    const username = currentUser.user_metadata?.full_name
    let filtered = []
    if (activeTab === 'disponibles') filtered = allOrders.filter(o => o.statut === 'En attente' && !o.vendeur_affecte)
    else if (activeTab === 'mes') filtered = allOrders.filter(o => o.vendeur_affecte === username && ['En cours','Préparée'].includes(o.statut))
    else if (activeTab === 'toutes') filtered = allOrders.filter(o => ['En attente','En cours','Préparée'].includes(o.statut))
    else if (activeTab === 'historique') filtered = allOrders.filter(o => ['Terminée','Annulée'].includes(o.statut))

    const el = document.getElementById('orders-list')
    if (!filtered.length) {
        el.innerHTML = `<div class="empty-state"><div class="emoji">📭</div><p>Aucune commande</p></div>`
        return
    }

    el.innerHTML = filtered.map(o => {
        const details = o.details_commande || []
        const baseTotal = details.reduce((s,d) => s + d.prix_achat * d.quantite, 0)
        const total = o.montant_ajuste ?? baseTotal
        const statusClass = {'En attente':'attente','En cours':'cours','Préparée':'preparee','Terminée':'terminee','Annulée':'annulee'}[o.statut] || 'attente'
        const date = new Date(o.date_commande).toLocaleDateString('fr-FR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})
        const username = currentUser.user_metadata?.full_name
        const isMine = o.vendeur_affecte === username
        const discordUrl = o.discord_thread_id ? `https://discord.com/channels/${GUILD_ID}/${o.discord_thread_id}` : null
        const isNew = o.statut === 'En attente' && !o.vendeur_affecte

        return `<div class="order-card ${isNew ? 'new-order' : ''}">
            <div class="order-header" onclick="toggleOrder('${o.id}')">
                <div>
                    <div class="order-ref">${esc(o.ref_commande || 'CMD-'+o.id)}</div>
                    <div class="order-client">👤 ${esc(o.client_pseudo)} ${o.vendeur_affecte ? '• 🎯 '+esc(o.vendeur_affecte) : ''}</div>
                    <div class="order-date">📅 ${date}</div>
                </div>
                <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
                    <div class="order-total">${total.toLocaleString()} $${o.montant_ajuste && o.montant_ajuste < baseTotal ? `<span style="font-size:12px;color:var(--text-dim);text-decoration:line-through;margin-left:6px">${baseTotal.toLocaleString()}</span>` : ''}</div>
                    <span class="status-badge status-${statusClass}">${esc(o.statut).toUpperCase()}</span>
                    <span style="color:var(--text-dim)">▼</span>
                </div>
            </div>
            <div class="order-body" id="body-${o.id}">
                <table class="order-table">
                    <thead><tr><th>Article</th><th>Qté</th><th style="text-align:right">Sous-total</th></tr></thead>
                    <tbody>
                        ${details.map(d => `<tr><td>${esc(d.nom_article)}</td><td>x${d.quantite}</td><td class="subtotal">${(d.prix_achat*d.quantite).toLocaleString()} $</td></tr>`).join('')}
                        <tr style="font-weight:700"><td colspan="2">TOTAL</td><td class="subtotal">${total.toLocaleString()} $</td></tr>
                    </tbody>
                </table>
                <div class="order-actions">
                    <div class="actions-left">
                        ${o.statut === 'En attente' && !o.vendeur_affecte ? `<button class="btn btn-prendre" onclick="prendreEnCharge(${o.id})">🎯 Prendre en charge</button>` : ''}
                        ${isMine && o.statut === 'En cours' ? `<button class="btn btn-preparee" onclick="setStatut(${o.id},'Préparée')">✅ Marquer Préparée</button>` : ''}
                        ${isMine && o.statut === 'Préparée' ? `<button class="btn btn-livree" onclick="setStatut(${o.id},'Terminée')">🎉 Marquer Livrée</button>` : ''}
                        ${(isMine || profile?.role_admin) && !['Terminée','Annulée'].includes(o.statut) ? `<button class="btn btn-annuler" onclick="setStatut(${o.id},'Annulée')">✕ Annuler</button>` : ''}
                        ${(isMine || profile?.role_admin) && o.statut === 'En cours' ? `<button class="btn btn-secondary" onclick="openEditOrder(${o.id})" style="font-size:11px">✏️ Modifier</button>` : ''}
                        ${profile?.role_admin && o.vendeur_affecte && !['Terminée','Annulée'].includes(o.statut) ? `<button class="btn btn-secondary" onclick="openReassign(${o.id},\`${o.vendeur_affecte||''}\`)" style="font-size:11px">🔄 Réaffecter</button>` : ''}
                        ${profile?.role_admin && ['Terminée','Annulée'].includes(o.statut) ? `<button class="btn btn-annuler" onclick="deleteCommande(${o.id})">🗑️ Supprimer</button>` : ''}
                    </div>
                    <div class="actions-right">
                        ${isMine && o.statut === 'En cours' ? `
                        <div class="montant-row">
                            <input class="montant-input" id="montant-${o.id}" type="number" value="${o.montant_ajuste || baseTotal}" placeholder="Montant">
                            <button class="btn-montant" onclick="saveMontant(${o.id})">💰 APPLIQUER</button>
                        </div>` : ''}
                        ${(profile?.role_vendeur || profile?.role_admin) ? `<button class="btn btn-secondary" onclick="showMateriauxCommande(${o.id})" style="font-size:11px;padding:7px 12px">🧱 Matériaux</button>` : ''}
                        ${discordUrl ? `<a href="${discordUrl}" target="_blank" class="btn-discord">💬 Thread Discord</a>` : ''}
                    </div>
                </div>
            </div>
        </div>`
    }).join('')
}

function toggleOrder(id) {
    document.getElementById('body-'+id)?.classList.toggle('open')
}

async function prendreEnCharge(id) {
    try {
        const username = currentUser.user_metadata?.full_name
        await callApi('update_commande', { id, updates: { statut: 'En cours', vendeur_affecte: username, vendeur_id: currentUser.id } })
        showToast('✅ Commande prise en charge', 'success')
        await loadOrders()
    } catch(e) { showToast('❌ '+e.message, 'error') }
}

async function setStatut(id, statut) {
    if (!confirm(`Passer la commande en "${statut}" ?`)) return
    try {
        const updates = { statut }
        if (['Terminée','Annulée'].includes(statut)) updates.date_fin = new Date().toISOString()
        await callApi('update_commande', { id, updates })
        showToast(`✅ Statut mis à jour : ${statut}`, 'success')
        await loadOrders()
    } catch(e) { showToast('❌ '+e.message, 'error') }
}

async function saveMontant(id) {
    const val = parseInt(document.getElementById('montant-'+id)?.value)
    if (!val || val < 0) { showToast('❌ Montant invalide', 'error'); return }
    try {
        await callApi('update_commande', { id, updates: { montant_ajuste: val } })
        showToast('✅ Montant ajusté', 'success')
        await loadOrders()
    } catch(e) { showToast('❌ '+e.message, 'error') }
}

function esc(str) {
    if (!str) return ''
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;')
}

function showToast(msg, type='') {
    const el = document.getElementById('toast')
    el.textContent = msg
    el.className = 'toast show '+type
    setTimeout(() => el.className = 'toast', 3000)
}

// ── RÉAFFECTATION ─────────────────────────────────────────────────────
function openReassign(orderId, currentVendeur) {
    document.getElementById('reassign-order-id').value = orderId
    document.getElementById('reassign-vendeur').value = currentVendeur || ''
    document.getElementById('modal-reassign').classList.add('active')
}

async function confirmReassign() {
    const id = parseInt(document.getElementById('reassign-order-id').value)
    const vendeur = document.getElementById('reassign-vendeur').value.trim()
    if (!vendeur) { showToast('❌ Saisissez un vendeur', 'error'); return }
    try {
        await callApi('update_commande', { id, updates: { vendeur_affecte: vendeur, statut: 'En cours' } })
        closeVentesModal('modal-reassign')
        showToast('✅ Commande réaffectée à ' + vendeur, 'success')
        await loadOrders()
    } catch(e) { showToast('❌ ' + e.message, 'error') }
}

// ── MODIFICATION COMMANDE ──────────────────────────────────────────────
let editLines = []
let currentEditOrder = null

function openEditOrder(orderId) {
    currentEditOrder = allOrders.find(o => o.id === orderId)
    if (!currentEditOrder) return
    document.getElementById('edit-order-id').value = orderId
    document.getElementById('edit-montant').value = currentEditOrder.montant_ajuste || ''
    editLines = (currentEditOrder.details_commande || []).map(d => ({...d}))
    renderEditLines()
    document.getElementById('modal-edit-order').classList.add('active')
}

function renderEditLines() {
    const el = document.getElementById('edit-order-articles')
    el.innerHTML = editLines.map((d, i) => `
        <div class="article-edit-row">
            <input value="${esc(d.nom_article)}" onchange="editLines[${i}].nom_article=this.value" style="flex:2;padding:6px 10px;background:var(--dark);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px" placeholder="Article">
            <input type="number" value="${d.quantite}" min="1" max="99" onchange="editLines[${i}].quantite=parseInt(this.value)||1" style="width:60px;padding:6px;background:var(--dark);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px" placeholder="Qté">
            <input type="number" value="${d.prix_achat}" min="0" onchange="editLines[${i}].prix_achat=parseInt(this.value)||0" style="width:100px;padding:6px;background:var(--dark);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px" placeholder="Prix $">
            <button onclick="removeLine(${i})" style="padding:4px 8px;background:transparent;border:1px solid rgba(200,21,42,0.3);border-radius:4px;color:#ff6b7a;cursor:pointer;font-size:12px">✕</button>
        </div>`).join('')
}

function addEditLine() {
    editLines.push({ nom_article: '', quantite: 1, prix_achat: 0 })
    renderEditLines()
}

function removeLine(i) {
    editLines.splice(i, 1)
    renderEditLines()
}

async function saveOrderEdit() {
    const id = parseInt(document.getElementById('edit-order-id').value)
    const montant = parseInt(document.getElementById('edit-montant').value) || null
    const validLines = editLines.filter(d => d.nom_article.trim())
    if (!validLines.length) { showToast('❌ Ajoutez au moins un article', 'error'); return }
    try {
        // Sauvegarder les détails via Edge Function (RLS compliant)
        await callApi('save_order_details', {
            id,
            details: validLines.map(d => ({
                nom_article: d.nom_article.trim(),
                quantite: d.quantite,
                prix_achat: d.prix_achat
            }))
        })
        // Mettre à jour le montant si ajusté
        await callApi('update_commande', { id, updates: { montant_ajuste: montant } })
        closeVentesModal('modal-edit-order')
        showToast('✅ Commande modifiée', 'success')
        await loadOrders()
    } catch(e) { showToast('❌ ' + e.message, 'error') }
}

// ── SUPPRESSION (admin) ────────────────────────────────────────────────
async function deleteCommande(id) {
    if (!confirm('Supprimer définitivement cette commande ?')) return
    try {
        await callApi('delete_commande', { id })
        showToast('✅ Commande supprimée', 'success')
        await loadOrders()
    } catch(e) { showToast('❌ ' + e.message, 'error') }
}

async function showMateriauxCommande(orderId) {
    const order = allOrders.find(o => o.id === orderId)
    if (!order) return
    document.getElementById('modal-mat-order').classList.add('active')
    const el = document.getElementById('mat-order-content')

    // Charger les matériaux depuis Supabase
    const details = order.details_commande || []
    if (!details.length) {
        el.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:20px">Aucun article dans cette commande.</div>'
        return
    }

    // Récupérer les articles et leurs matériaux
    const { data: articles } = await sb.from('articles').select('id, name').in('name', details.map(d => d.nom_article))
    const { data: materiaux } = await sb.from('materiaux').select('*').order('col_order')
    
    if (!articles?.length || !materiaux?.length) {
        el.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:20px">Aucun matériau configuré pour ces articles.</div>'
        return
    }

    const articleIds = articles.map(a => a.id)
    const { data: artMat } = await sb.from('article_materiaux').select('*').in('article_id', articleIds)

    if (!artMat?.length) {
        el.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:20px">Aucun matériau associé à ces articles.</div>'
        return
    }

    // Calculer les totaux par matériau
    const totals = {}
    for (const detail of details) {
        const art = articles.find(a => a.name === detail.nom_article)
        if (!art) continue
        const mats = artMat.filter(am => am.article_id === art.id)
        for (const am of mats) {
            if (!totals[am.materiau_id]) totals[am.materiau_id] = { qty: 0, prix: 0 }
            totals[am.materiau_id].qty += am.quantite * detail.quantite
            totals[am.materiau_id].prix += am.prix_fabrication * detail.quantite
        }
    }

    const items = materiaux.filter(m => totals[m.id])
    if (!items.length) {
        el.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:20px">Aucun matériau nécessaire.</div>'
        return
    }

    el.innerHTML = `<div class="mat-grid">${items.map(m => {
        const t = totals[m.id]
        const val = m.col_type === 'prix' ? `${t.prix.toLocaleString()} $` : `x${t.qty}`
        return `<div class="mat-item"><span class="mat-nom">${esc(m.nom)}</span><span class="mat-val">${val}</span></div>`
    }).join('')}</div>`
}

function closeVentesModal(id) { document.getElementById(id).classList.remove('active') }

async function logout() { await sb.auth.signOut(); window.location.href = 'index.html' }

init()

// Déconnexion à la fermeture de l'onglet/fenêtre
window.addEventListener('beforeunload', () => {
    sessionStorage.removeItem('session_active')
})
</script>
