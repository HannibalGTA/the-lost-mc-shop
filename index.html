<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE LOST MC SHOP</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { background-color: #0a0a0a; color: #fff; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #222; margin-bottom: 20px; }
        h1 { font-size: 24px; letter-spacing: 2px; color: #fff; text-transform: uppercase; }
        
        .user-badge { display: flex; align-items: center; gap: 10px; }
        .tag { padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; background: #444; }
        
        button { padding: 8px 15px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-logout { background: #aa2222; color: #fff; }
        .btn-logout:hover { background: #cc3333; }
        
        nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-tab { background: #222; color: #888; }
        .nav-tab.active { background: #fff; color: #000; }
        
        .hidden { display: none !important; }
        
        /* Catalogue */
        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #111; border: 1px solid #222; border-radius: 6px; padding: 15px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .card h3 { text-transform: uppercase; margin-bottom: 10px; }
        .card p { color: #888; font-size: 13px; margin-bottom: 15px; }
        .card .price { font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        .btn-commander { background: #fff; color: #000; width: 100%; }
        
        /* Tableaux de suivi */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #111; border-radius: 6px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #222; }
        th { background: #181818; text-transform: uppercase; font-size: 13px; color: #888; }
        
        /* Connexion écran complet */
        #login-screen { position: fixed; top:0; left:0; width:100%; height:100%; background:#0a0a0a; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index: 1000; }
        .login-box { background:#111; padding:30px; border-radius:8px; border:1px solid #222; width:100%; max-width:400px; text-align:center; }
        .login-box input { width:100%; padding:10px; margin:10px 0; background:#1a1a1a; border:1px solid #333; color:#fff; border-radius:4px; }
        .login-box button { width:100%; background:#fff; color:#000; padding:10px; margin-top:10px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>THE LOST MC SHOP</h2>
            <p style="color:#666; font-size:13px; margin-bottom:15px;">Connexion au système de gestion</p>
            <input type="number" id="login-id" placeholder="ID Serveur (ex: 51871)">
            <input type="text" id="login-name" placeholder="Nom d'utilisateur (ex: Carnicero)">
            <button id="btn-login">SE CONNECTER</button>
        </div>
    </div>

    <div id="main-interface" class="hidden">
        <header>
            <h1>The Lost MC Shop</h1>
            <div class="user-badge">
                <span id="player-tag" class="tag">CLIENT</span>
                <span id="player-name" style="font-weight:bold;">...</span>
                <button id="btn-logout" class="btn-logout">DÉCONNEXION</button>
            </div>
        </header>

        <nav>
            <button class="nav-tab active" onclick="showTab('shop')">🛒 Catalogue</button>
            <button class="nav-tab" onclick="showTab('orders')">📋 Suivi Commandes</button>
            <button id="nav-vendeur" class="nav-tab hidden" onclick="showTab('vendedor-panel')">💼 Espace Vendeur</button>
        </nav>

        <div id="tab-shop" class="tab-content">
            <h2>Articles disponibles</h2>
            <div class="catalog-grid" id="catalog-grid">
                </div>
        </div>

        <div id="tab-orders" class="tab-content class hidden">
            <h2>Mes Commandes</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID Cmd</th>
                        <th>Article</th>
                        <th>Prix</th>
                        <th>Statut</th>
                    </tr>
                </thead>
                <tbody id="client-orders-rows">
                    </tbody>
            </table>
        </div>

        <div id="tab-vendedor-panel" class="tab-content hidden">
            <h2>Gestion des Commandes Vendeurs</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID Cmd</th>
                        <th>Client ID</th>
                        <th>Article</th>
                        <th>Prix</th>
                        <th>Statut</th>
                        <th>Vendeur</th>
                    </tr>
                </thead>
                <tbody id="vendeur-orders-rows">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // CONFIGURATION SUPABASE
        const SUPABASE_URL = "https://mvmngahkjvfpcwrstlns.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_vESTqx5M-mdXuVj-lUrkSA_CGHyC7XS"; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Éléments du DOM
        const loginScreen = document.getElementById('login-screen');
        const mainInterface = document.getElementById('main-interface');
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');

        // Gestion de la session
        window.addEventListener('DOMContentLoaded', () => {
            const userId = localStorage.getItem('user_id');
            const userLogin = localStorage.getItem('user_login');
            if (userId && userLogin) {
                connexionReussie(userId, userLogin);
            }
        });

        btnLogin.addEventListener('click', async () => {
            const idInput = document.getElementById('login-id').value;
            const nameInput = document.getElementById('login-name').value;

            if(!idInput || !nameInput) {
                alert("Veuillez remplir les deux champs.");
                return;
            }

            // Vérifier ou créer l'utilisateur dans Supabase
            const { data: user, error } = await supabaseClient
                .from('utilisateurs')
                .select('*')
                .eq('id_serveur', parseInt(idInput))
                .maybeSingle();

            if (!user) {
                // Créer le profil client s'il n'existe pas encore
                await supabaseClient.from('utilisateurs').insert([{ id_serveur: parseInt(idInput), login: nameInput }]);
            }

            localStorage.setItem('user_id', idInput);
            localStorage.setItem('user_login', nameInput);
            connexionReussie(idInput, nameInput);
        });

        btnLogout.addEventListener('click', () => {
            localStorage.clear();
            window.location.reload();
        });

        async function connexionReussie(id, login) {
            loginScreen.classList.add('hidden');
            mainInterface.classList.remove('hidden');
            document.getElementById('player-name').textContent = login;

            // Charger les rôles
            const { data: user } = await supabaseClient.from('utilisateurs').select('*').eq('id_serveur', parseInt(id)).maybeSingle();
            const tag = document.getElementById('player-tag');
            
            if (user?.role_admin || user?.role_vendeur) {
                tag.textContent = user.role_admin ? "ADMIN" : "VENDEUR";
                tag.style.backgroundColor = user.role_admin ? "#aa2222" : "#d4af37";
                tag.style.color = user.role_admin ? "#fff" : "#000";
                document.getElementById('nav-vendeur').classList.remove('hidden');
            }

            loadCatalogue();
            loadClientOrders();
            loadVendeurOrders();
        }

        // Navigation par onglets
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
            document.querySelectorAll('.nav-tab').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            event.target.classList.add('active');
        }

        // Charger les articles de Supabase
        async function loadCatalogue() {
            const grid = document.getElementById('catalog-grid');
            const { data: articles } = await supabaseClient.from('articles').select('*');
            
            if(!grid) return;
            grid.innerHTML = "";

            if (!articles || articles.length === 0) {
                grid.innerHTML = "<p>Aucun article en vente pour le moment.</p>";
                return;
            }

            articles.forEach(art => {
                const card = document.createElement('div');
                card.className = "card";
                card.innerHTML = `
                    <div>
                        <h3>${art.nom}</h3>
                        <p>${art.description || ''}</p>
                    </div>
                    <div>
                        <div class="price">${art.prix_de_base} €</div>
                        <button class="btn-commander" onclick="commanderArticle('${art.nom}', ${art.prix_de_base}, this)">Commander</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Traiter une commande
        async function commanderArticle(nom, prix, bouton) {
            const userId = localStorage.getItem('user_id');
            bouton.disabled = true;
            bouton.textContent = "Envoi...";

            // 1. Insertion Commande principale
            const { data: cmd, error: err1 } = await supabaseClient
                .from('commandes')
                .insert([{ client_id: parseInt(userId), statut: 'En attente' }])
                .select();

            if (err1) {
                alert("Erreur commande : " + err1.message);
                bouton.disabled = false;
                bouton.textContent = "Commander";
                return;
            }

            // 2. Insertion Détails commande
            const { error: err2 } = await supabaseClient
                .from('details_commande')
                .insert([{ id_commande: cmd[0].id, nom_article: nom, quantite: 1, prix_achat: prix }]);

            if (err2) {
                alert("Erreur détails : " + err2.message);
            } else {
                bouton.textContent = "COMMANDÉ !";
                bouton.style.backgroundColor = "#22aa22";
                bouton.style.color = "#fff";
                loadClientOrders();
                loadVendeurOrders();
            }
        }

        // Charger les commandes d'un client
        async function loadClientOrders() {
            const userId = localStorage.getItem('user_id');
            const tbody = document.getElementById('client-orders-rows');
            if(!tbody) return;

            const { data: orders } = await supabaseClient
                .from('commandes')
                .select('id, statut, details_commande(nom_article, prix_achat)')
                .eq('client_id', parseInt(userId));

            tbody.innerHTML = "";
            orders?.forEach(o => {
                const detail = o.details_commande?.[0] || { nom_article: 'Inconnu', prix_achat: 0 };
                tbody.innerHTML += `
                    <tr>
                        <td>#${o.id}</td>
                        <td>${detail.nom_article}</td>
                        <td>${detail.prix_achat} €</td>
                        <td><span class="tag">${o.statut}</span></td>
                    </tr>
                `;
            });
        }

        // Charger toutes les commandes (Espace Vendeur)
        async function loadVendeurOrders() {
            const tbody = document.getElementById('vendeur-orders-rows');
            if(!tbody) return;

            const { data: orders } = await supabaseClient
                .from('commandes')
                .select('id, client_id, statut, vendeur_affecte, details_commande(nom_article, prix_achat)');

            tbody.innerHTML = "";
            orders?.forEach(o => {
                const detail = o.details_commande?.[0] || { nom_article: 'Inconnu', prix_achat: 0 };
                tbody.innerHTML += `
                    <tr>
                        <td>#${o.id}</td>
                        <td>${o.client_id}</td>
                        <td>${detail.nom_article}</td>
                        <td>${detail.prix_achat} €</td>
                        <td><strong>${o.statut}</strong></td>
                        <td>${o.vendeur_affecte || 'Personne'}</td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
