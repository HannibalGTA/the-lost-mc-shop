<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue — The Lost MC Shop</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏍️</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --black:      #080A0E;
            --dark:       #0D1117;
            --dark2:      #141922;
            --dark3:      #1C2333;
            --border:     #2A3347;
            --red:        #C8152A;
            --red-glow:   rgba(200,21,42,0.25);
            --gold:       #C9A84C;
            --text:       #E8EDF5;
            --text-muted: #6B7A99;
            --text-dim:   #3D4F6E;
            --green:      #22c55e;
            --sidebar-w:  260px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--black); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; }

        /* ── SIDEBAR ── */
        .sidebar {
            width: var(--sidebar-w);
            min-height: 100vh;
            background: var(--dark2);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0; top: 0; bottom: 0;
            z-index: 100;
        }

        .sidebar-logo {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        .sidebar-logo img { width: 100px; filter: drop-shadow(0 0 10px rgba(200,21,42,0.3)); }

        .sidebar-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 18px;
            letter-spacing: 3px;
            color: var(--text);
            margin-top: 8px;
        }
        .sidebar-title span { color: var(--red); }

        .sidebar-nav {
            flex: 1;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
            position: relative;
        }

        .nav-item:hover { background: var(--dark3); color: var(--text); }
        .nav-item.active { background: rgba(200,21,42,0.15); color: var(--text); border-left: 2px solid var(--red); }
        .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }

        .nav-badge {
            margin-left: auto;
            background: var(--red);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }

        .nav-section {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--text-dim);
            padding: 12px 14px 4px;
            text-transform: uppercase;
        }

        .sidebar-bottom {
            padding: 16px 12px;
            border-top: 1px solid var(--border);
        }

        .user-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--dark3);
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .user-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 2px solid var(--red);
            object-fit: cover;
            background: var(--dark);
        }

        .user-name { font-size: 13px; font-weight: 600; }
        .user-role {
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--gold);
            letter-spacing: 1px;
        }

        .btn-logout {
            width: 100%;
            padding: 8px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-logout:hover { border-color: var(--red); color: var(--red); }

        /* ── MAIN ── */
        .main {
            margin-left: var(--sidebar-w);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* ── TOPBAR ── */
        .topbar {
            padding: 20px 32px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--dark);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .page-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 24px;
            letter-spacing: 3px;
            color: var(--text);
        }

        .topbar-actions { display: flex; align-items: center; gap: 12px; }

        /* ── CAT TABS ── */
        .cat-tabs {
            display: flex;
            gap: 4px;
            padding: 20px 32px 0;
        }

        .cat-tab {
            padding: 10px 20px;
            border-radius: 6px 6px 0 0;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border: 1px solid transparent;
            border-bottom: none;
            transition: all 0.15s;
            background: transparent;
        }

        .cat-tab:hover { color: var(--text); background: var(--dark2); }
        .cat-tab.active {
            color: var(--text);
            background: var(--dark2);
            border-color: var(--border);
            border-bottom: 2px solid var(--red);
        }

        /* ── CATALOGUE GRID ── */
        .catalogue-wrap {
            padding: 0 32px 32px;
            background: var(--dark2);
            border: 1px solid var(--border);
            border-radius: 0 8px 8px 8px;
            margin: 0 32px 32px;
            min-height: 400px;
        }

        .catalogue-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            padding: 24px 0;
        }

        /* ── ARTICLE CARD ── */
        .article-card {
            background: var(--dark3);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.2s;
            position: relative;
            cursor: pointer;
        }

        .article-card:hover {
            border-color: rgba(200,21,42,0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .article-card.unavailable { opacity: 0.5; pointer-events: none; }

        .article-img-wrap {
            height: 160px;
            background: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .article-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .article-card:hover .article-img { transform: scale(1.05); }

        .article-img-placeholder {
            font-size: 48px;
            opacity: 0.3;
        }

        .article-badge {
            position: absolute;
            top: 8px; right: 8px;
            background: var(--red);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 1px;
            padding: 3px 8px;
            border-radius: 3px;
        }

        .article-body {
            padding: 14px;
        }

        .article-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .article-mag {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-family: 'JetBrains Mono', monospace;
        }

        .article-desc {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .article-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .article-price {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 22px;
            color: var(--green);
            letter-spacing: 1px;
        }

        .article-price-promo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 14px;
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .btn-add {
            padding: 8px 14px;
            background: var(--red);
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .btn-add:hover { background: #a01020; transform: scale(1.02); }

        /* ── PANIER SIDEBAR ── */
        .cart-panel {
            position: fixed;
            right: 0; top: 0; bottom: 0;
            width: 320px;
            background: var(--dark2);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 200;
        }

        .cart-panel.open { transform: translateX(0); }

        .cart-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cart-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 20px;
            letter-spacing: 2px;
        }

        .btn-close-cart {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
        }

        .btn-close-cart:hover { color: var(--text); }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .cart-empty {
            text-align: center;
            color: var(--text-dim);
            padding: 40px 20px;
            font-size: 13px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--dark3);
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }

        .cart-item-name { font-size: 13px; font-weight: 600; flex: 1; }
        .cart-item-price { font-size: 12px; color: var(--green); font-family: 'JetBrains Mono', monospace; }

        .cart-qty {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .qty-btn {
            width: 24px; height: 24px;
            background: var(--dark);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
        }

        .qty-btn:hover { border-color: var(--red); color: var(--red); }
        .qty-num { font-size: 13px; font-weight: 700; min-width: 20px; text-align: center; }

        .btn-remove-item {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            transition: color 0.15s;
        }
        .btn-remove-item:hover { color: var(--red); }

        .cart-footer {
            padding: 16px;
            border-top: 1px solid var(--border);
        }

        .promo-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .promo-input {
            flex: 1;
            padding: 8px 12px;
            background: var(--dark3);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 1px;
        }

        .promo-input:focus { outline: none; border-color: var(--red); }
        .promo-input::placeholder { color: var(--text-dim); }

        .btn-promo {
            padding: 8px 14px;
            background: var(--dark3);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-promo:hover { border-color: var(--gold); color: var(--gold); }

        .promo-applied {
            display: none;
            font-size: 12px;
            color: var(--green);
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 12px;
            padding: 8px 12px;
            background: rgba(34,197,94,0.1);
            border: 1px solid rgba(34,197,94,0.2);
            border-radius: 6px;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 12px;
            background: var(--dark3);
            border-radius: 6px;
        }

        .cart-total-label { font-size: 13px; color: var(--text-muted); font-weight: 600; }
        .cart-total-amount {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 24px;
            color: var(--green);
            letter-spacing: 1px;
        }

        .btn-checkout {
            width: 100%;
            padding: 14px;
            background: var(--red);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 18px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-checkout:hover { background: #a01020; }
        .btn-checkout:disabled { opacity: 0.5; pointer-events: none; }

        /* ── CART TOGGLE BTN ── */
        .btn-cart-toggle {
            position: relative;
            padding: 8px 16px;
            background: var(--dark3);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-cart-toggle:hover { border-color: var(--red); }

        .cart-count {
            background: var(--red);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }

        /* ── OVERLAY ── */
        .cart-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 199;
        }
        .cart-overlay.active { display: block; }

        /* ── LOADING ── */
        .loading-grid {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: var(--text-muted);
            font-size: 13px;
            gap: 12px;
        }

        .spinner {
            width: 20px; height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--red);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--dark3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 13px;
            color: var(--text);
            z-index: 500;
            transition: transform 0.3s ease;
            white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: var(--green); }
        .toast.error { border-color: var(--red); color: #ff6b7a; }

        /* ── MODAL COMMANDE ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 300;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--dark2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 32px;
            max-width: 480px;
            width: 90%;
            position: relative;
        }

        .modal::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--red), transparent);
        }

        .modal-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 22px;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .order-summary { margin-bottom: 20px; }

        .order-line {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .order-line:last-child { border-bottom: none; }
        .order-total {
            font-weight: 700;
            color: var(--green);
            font-family: 'Bebas Neue', sans-serif;
            font-size: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-cancel {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-cancel:hover { border-color: var(--red); color: var(--red); }

        .btn-confirm {
            flex: 1;
            padding: 12px;
            background: var(--red);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 18px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-confirm:hover { background: #a01020; }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
    <div class="sidebar-logo">
        <div id="sidebar-logo-img">🏍️</div>
        <div class="sidebar-title">THE <span>LOST</span> MC SHOP</div>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-section">Navigation</div>
        <a class="nav-item active" href="catalogue.html">
            <span class="icon">🔫</span> Catalogue
        </a>
        <a class="nav-item" href="commandes.html" id="nav-commandes">
            <span class="icon">📦</span> Mes Commandes
            <span class="nav-badge hidden" id="badge-commandes">0</span>
        </a>
        <a class="nav-item hidden" href="ventes.html" id="nav-ventes">
            <span class="icon">🎯</span> Gestion Ventes
            <span class="nav-badge hidden" id="badge-ventes">0</span>
        </a>
        <a class="nav-item hidden" href="admin.html" id="nav-admin">
            <span class="icon">⚙️</span> Administration
        </a>
    </nav>
    <div class="sidebar-bottom">
        <div class="user-card">
            <img class="user-avatar" id="user-avatar" src="" alt="">
            <div>
                <div class="user-name" id="user-name">—</div>
                <div class="user-role" id="user-role">CLIENT</div>
            </div>
        </div>
        <button class="btn-logout" onclick="logout()">🚪 Déconnexion</button>
    </div>
</aside>

<!-- MAIN -->
<main class="main">
    <div class="topbar">
        <div class="page-title">📂 CATALOGUE LOST MC</div>
        <div class="topbar-actions">
            <button class="btn-cart-toggle" onclick="toggleCart()">
                🛒 Panier
                <span class="cart-count" id="cart-count">0</span>
            </button>
        </div>
    </div>

    <!-- ONGLETS CATÉGORIES -->
    <div class="cat-tabs">
        <button class="cat-tab active" id="tab-weapons" onclick="switchCat('weapons')">⚙️ Armes à feu</button>
        <button class="cat-tab" id="tab-others" onclick="switchCat('others')">🎒 Équipement</button>
        <button class="cat-tab" id="tab-munitions" onclick="switchCat('munitions')">💥 Munitions</button>
    </div>

    <!-- GRILLE ARTICLES -->
    <div class="catalogue-wrap">
        <div id="catalogue-grid" class="catalogue-grid">
            <div class="loading-grid"><div class="spinner"></div> Chargement du catalogue...</div>
        </div>
    </div>
</main>

<!-- OVERLAY PANIER -->
<div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>

<!-- PANIER -->
<aside class="cart-panel" id="cart-panel">
    <div class="cart-header">
        <div class="cart-title">🛒 BON DE COMMANDE</div>
        <button class="btn-close-cart" onclick="toggleCart()">✕</button>
    </div>
    <div class="cart-items" id="cart-items">
        <div class="cart-empty">Votre panier est vide</div>
    </div>
    <div class="cart-footer">
        <div class="promo-row">
            <input class="promo-input" id="promo-input" placeholder="CODE PROMO" maxlength="20">
            <button class="btn-promo" onclick="applyPromo()">APPLIQUER</button>
        </div>
        <div class="promo-applied" id="promo-applied"></div>
        <div class="cart-total">
            <span class="cart-total-label">NET À PAYER</span>
            <span class="cart-total-amount" id="cart-total">0 $</span>
        </div>
        <button class="btn-checkout" id="btn-checkout" onclick="openCheckout()" disabled>
            VALIDER ET TRANSMETTRE
        </button>
    </div>
</aside>

<!-- MODAL CONFIRMATION COMMANDE -->
<div class="modal-overlay" id="modal-checkout">
    <div class="modal">
        <div class="modal-title">📋 CONFIRMER LA COMMANDE</div>
        <div class="order-summary" id="order-summary"></div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">Annuler</button>
            <button class="btn-confirm" onclick="submitOrder()">TRANSMETTRE</button>
        </div>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://dosjkcwitjskydrcmbhj.supabase.co'
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRvc2prY3dpdGpza3lkcmNtYmhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MjM1NTAsImV4cCI6MjEwMDk5OTU1MH0.1QcwS98HHeGjR0bwmBBLb-MpRxS-gO8mZDh0eSDZ740'
const API_URL = 'https://dosjkcwitjskydrcmbhj.supabase.co/functions/v1/lostmc-api'

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON)

let currentUser = null
let accessToken = null
let profile = null
let catalog = []
let cart = []
let activeCat = 'weapons'
let appliedPromo = null

// ── INIT ──────────────────────────────────────────────────────────────
async function init() {
    const { data: { session } } = await sb.auth.getSession()
    if (!session) { window.location.href = 'index.html'; return }
    currentUser = session.user
    accessToken = session.access_token

    // Afficher infos user
    document.getElementById('user-name').textContent = currentUser.user_metadata?.full_name || 'Inconnu'
    const avatar = currentUser.user_metadata?.avatar_url
    if (avatar) document.getElementById('user-avatar').src = avatar
    else document.getElementById('user-avatar').src = ''

    // Charger profil depuis Edge Function (vérifie les rôles Discord)
    await loadProfile()
    await loadCatalogue()
    await loadNotifs()
}

async function callApi(action, payload = {}) {
    const res = await fetch(API_URL, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + accessToken,
            'apikey': SUPABASE_ANON
        },
        body: JSON.stringify({ action, payload })
    })
    const data = await res.json()
    if (data.error) throw new Error(data.error)
    return data
}

async function loadProfile() {
    try {
        const data = await callApi('get_profile')
        profile = data.profile
        const role = profile?.role_admin ? 'ADMIN' : profile?.role_vendeur ? 'VENDEUR' : 'CLIENT'
        document.getElementById('user-role').textContent = role

        // Afficher menus selon rôle
        if (profile?.role_vendeur || profile?.role_admin) {
            document.getElementById('nav-ventes').classList.remove('hidden')
        }
        if (profile?.role_admin) {
            document.getElementById('nav-admin').classList.remove('hidden')
        }
    } catch(e) {
        await sb.auth.signOut()
        window.location.href = 'index.html'
    }
}

async function loadCatalogue() {
    const { data } = await sb.from('articles').select('*').eq('disponible', true).order('cat').order('sort_order')
    catalog = data || []
    renderCatalogue()
}

function switchCat(cat) {
    activeCat = cat
    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'))
    document.getElementById('tab-' + cat).classList.add('active')
    renderCatalogue()
}

function renderCatalogue() {
    const grid = document.getElementById('catalogue-grid')
    const items = catalog.filter(a => a.cat === activeCat)

    if (!items.length) {
        grid.innerHTML = '<div class="loading-grid" style="color:var(--text-dim)">Aucun article disponible</div>'
        return
    }

    const tauxPromo = appliedPromo ? appliedPromo.taux : 0

    grid.innerHTML = items.map(a => {
        const prix = a.price
        const prixFinal = tauxPromo ? Math.round(prix * (1 - tauxPromo/100)) : prix
        const img = a.img_url
            ? `<img class="article-img" src="${esc(a.img_url)}" alt="${esc(a.name)}" onerror="this.style.display='none'">`
            : `<div class="article-img-placeholder">🔫</div>`
        const badge = a.badge_label ? `<div class="article-badge">${esc(a.badge_label)}</div>` : ''
        const prixHtml = tauxPromo
            ? `<div><div class="article-price-promo">${prix.toLocaleString()} $</div><div class="article-price">${prixFinal.toLocaleString()} $</div></div>`
            : `<div class="article-price">${prix.toLocaleString()} $</div>`

        return `<div class="article-card">
            <div class="article-img-wrap">${img}${badge}</div>
            <div class="article-body">
                <div class="article-name">${esc(a.name)}</div>
                ${a.mag ? `<div class="article-mag">${esc(a.mag)}</div>` : ''}
                ${a.description ? `<div class="article-desc">${esc(a.description)}</div>` : ''}
                <div class="article-footer">
                    ${prixHtml}
                    <button class="btn-add" onclick="addToCart(${a.id})">+ AJOUTER</button>
                </div>
            </div>
        </div>`
    }).join('')
}

// ── PANIER ────────────────────────────────────────────────────────────
function addToCart(id) {
    const art = catalog.find(a => a.id === id)
    if (!art) return
    const ex = cart.find(c => c.id === id)
    if (ex) { if (ex.qty < 99) ex.qty++ }
    else cart.push({ id: art.id, name: art.name, price: art.price, qty: 1 })
    updateCart()
    showToast('✅ ' + art.name + ' ajouté', 'success')
}

function updateCart() {
    const count = cart.reduce((s, c) => s + c.qty, 0)
    document.getElementById('cart-count').textContent = count
    document.getElementById('btn-checkout').disabled = count === 0
    renderCartItems()
    renderTotal()
}

function renderCartItems() {
    const el = document.getElementById('cart-items')
    if (!cart.length) { el.innerHTML = '<div class="cart-empty">Votre panier est vide</div>'; return }
    el.innerHTML = cart.map(c => `
        <div class="cart-item">
            <div style="flex:1">
                <div class="cart-item-name">${esc(c.name)}</div>
                <div class="cart-item-price">${(c.price * c.qty).toLocaleString()} $</div>
            </div>
            <div class="cart-qty">
                <button class="qty-btn" onclick="changeQty(${c.id},-1)">−</button>
                <span class="qty-num">x${c.qty}</span>
                <button class="qty-btn" onclick="changeQty(${c.id},1)">+</button>
            </div>
            <button class="btn-remove-item" onclick="removeFromCart(${c.id})">✕</button>
        </div>`).join('')
}

function changeQty(id, delta) {
    const item = cart.find(c => c.id === id)
    if (!item) return
    item.qty = Math.max(1, Math.min(99, item.qty + delta))
    updateCart()
}

function removeFromCart(id) {
    cart = cart.filter(c => c.id !== id)
    updateCart()
}

function getTotal() {
    const base = cart.reduce((s, c) => s + c.price * c.qty, 0)
    const taux = appliedPromo ? appliedPromo.taux : 0
    return taux ? Math.round(base * (1 - taux/100)) : base
}

function renderTotal() {
    document.getElementById('cart-total').textContent = getTotal().toLocaleString() + ' $'
}

function toggleCart() {
    document.getElementById('cart-panel').classList.toggle('open')
    document.getElementById('cart-overlay').classList.toggle('active')
}

// ── CODE PROMO ────────────────────────────────────────────────────────
async function applyPromo() {
    const code = document.getElementById('promo-input').value.trim().toUpperCase()
    if (!code) return
    const { data: promos } = await sb.from('codes_promo').select('*').eq('code', code).eq('actif', true).maybeSingle()
    if (!promos) { showToast('❌ Code invalide ou expiré', 'error'); return }
    if (promos.max_uses && promos.uses_count >= promos.max_uses) { showToast('❌ Code épuisé', 'error'); return }
    appliedPromo = promos
    document.getElementById('promo-applied').style.display = 'block'
    document.getElementById('promo-applied').textContent = `✅ Code ${code} appliqué — ${promos.taux}% de réduction`
    renderCatalogue()
    renderTotal()
    showToast('✅ Code promo appliqué !', 'success')
}

// ── COMMANDE ──────────────────────────────────────────────────────────
function openCheckout() {
    if (!cart.length) return
    const total = getTotal()
    const summary = document.getElementById('order-summary')
    summary.innerHTML = cart.map(c => `
        <div class="order-line">
            <span>${esc(c.name)} x${c.qty}</span>
            <span>${(c.price * c.qty).toLocaleString()} $</span>
        </div>`).join('') +
        (appliedPromo ? `<div class="order-line" style="color:var(--red)">
            <span>🏷️ Code ${appliedPromo.code} (-${appliedPromo.taux}%)</span>
            <span>-${(cart.reduce((s,c)=>s+c.price*c.qty,0)-total).toLocaleString()} $</span>
        </div>` : '') +
        `<div class="order-line"><span class="cart-total-label">TOTAL</span><span class="order-total">${total.toLocaleString()} $</span></div>`
    document.getElementById('modal-checkout').classList.add('active')
}

function closeModal() {
    document.getElementById('modal-checkout').classList.remove('active')
}

async function submitOrder() {
    closeModal()
    try {
        const total = getTotal()
        const details = cart.map(c => ({ nom_article: c.name, quantite: c.qty, prix_achat: c.price }))
        const data = await callApi('create_commande', {
            commande: {
                statut: 'En attente',
                ref_commande: null,
                montant_ajuste: appliedPromo ? total : null,
                code_promo: appliedPromo?.code || null,
                taux_promo: appliedPromo?.taux || null
            },
            details
        })
        if (data.success) {
            // Mettre à jour le compteur code promo
            if (appliedPromo) {
                await callApi('update_promo_uses', {
                    id: appliedPromo.id,
                    uses_count: appliedPromo.uses_count + 1,
                    actif: appliedPromo.reutilisable ? true : (appliedPromo.uses_count + 1 < (appliedPromo.max_uses || 999))
                })
            }
            // Générer la ref
            const ref = generateRef(cart, data.data.id)
            await callApi('update_commande', { id: data.data.id, updates: { ref_commande: ref } })
            cart = []
            appliedPromo = null
            document.getElementById('promo-input').value = ''
            document.getElementById('promo-applied').style.display = 'none'
            updateCart()
            toggleCart()
            showToast('✅ Commande ' + ref + ' transmise !', 'success')
            setTimeout(() => window.location.href = 'commandes.html', 2000)
        }
    } catch(e) {
        showToast('❌ ' + e.message, 'error')
    }
}

function generateRef(items, dbId) {
    const hasW = items.some(i => { const a = catalog.find(x => x.id === i.id); return a && a.cat === 'weapons' })
    const hasO = items.some(i => { const a = catalog.find(x => x.id === i.id); return a && a.cat === 'others' })
    const hasM = items.some(i => { const a = catalog.find(x => x.id === i.id); return a && a.cat === 'munitions' })
    const type = (hasW && hasO) || (hasW && hasM) || (hasO && hasM) ? 'MX' : hasW ? 'WP' : hasM ? 'MN' : 'EQ'
    const now = new Date()
    const yy = String(now.getFullYear()).slice(-2)
    const day = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000)
    return `LOST-${type}${yy}${String(day % 100).padStart(2,'0')}-${dbId}`
}

// ── NOTIFICATIONS ─────────────────────────────────────────────────────
async function loadNotifs() {
    const username = currentUser?.user_metadata?.full_name
    if (!username) return
    const { data } = await sb.from('notifications').select('*').eq('login', username).eq('lu', false)
    const notifs = data || []
    const nS = notifs.filter(n => n.type === 'statut').length
    const nM = notifs.filter(n => n.type === 'message').length
    const badge = document.getElementById('badge-commandes')
    if (nS > 0) { badge.textContent = nS; badge.classList.remove('hidden') }
    else badge.classList.add('hidden')
    const bv = document.getElementById('badge-ventes')
    if (nM > 0 && (profile?.role_vendeur || profile?.role_admin)) { bv.textContent = nM; bv.classList.remove('hidden') }
    else bv.classList.add('hidden')
}

// ── UTILS ─────────────────────────────────────────────────────────────
function esc(str) {
    if (!str) return ''
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;')
}

function showToast(msg, type = '') {
    const el = document.getElementById('toast')
    el.textContent = msg
    el.className = 'toast show ' + type
    setTimeout(() => el.className = 'toast', 3000)
}

async function logout() {
    await sb.auth.signOut()
    window.location.href = 'index.html'
}

// ── START ─────────────────────────────────────────────────────────────
init()
setInterval(loadNotifs, 30000)
</script>
</body>
</html>
