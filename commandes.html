<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Commandes — The Lost MC Shop</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏍️</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #080A0E; --dark: #0D1117; --dark2: #141922; --dark3: #1C2333;
            --border: #2A3347; --red: #C8152A; --gold: #C9A84C;
            --text: #E8EDF5; --text-muted: #6B7A99; --text-dim: #3D4F6E;
            --green: #22c55e; --blue: #3b82f6; --sidebar-w: 260px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--black); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; }

        /* SIDEBAR */
        .sidebar { width: var(--sidebar-w); min-height: 100vh; background: var(--dark2); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; }
        .sidebar-logo { padding: 24px 20px; border-bottom: 1px solid var(--border); text-align: center; }
        .sidebar-title { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 3px; color: var(--text); margin-top: 8px; }
        .sidebar-title span { color: var(--red); }
        .sidebar-nav { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; transition: all 0.15s; text-decoration: none; }
        .nav-item:hover { background: var(--dark3); color: var(--text); }
        .nav-item .icon { font-style: normal; }
        .nav-item.active { background: rgba(200,21,42,0.15); color: var(--text); border-left: 2px solid var(--red); }
        .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
        .nav-badge { margin-left: auto; background: var(--red); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 10px; min-width: 18px; text-align: center; }
        .nav-section { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 2px; color: var(--text-dim); padding: 12px 14px 4px; text-transform: uppercase; }
        .sidebar-bottom { padding: 16px 12px; border-top: 1px solid var(--border); }
        .user-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--dark3); border-radius: 6px; margin-bottom: 8px; }
        .user-avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--red); object-fit: cover; background: var(--dark); }
        .user-name { font-size: 13px; font-weight: 600; }
        .user-role { font-size: 10px; font-family: 'JetBrains Mono', monospace; color: var(--gold); letter-spacing: 1px; }
        .btn-logout { width: 100%; padding: 8px; background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--text-muted); font-size: 12px; cursor: pointer; transition: all 0.15s; }
        .btn-logout:hover { border-color: var(--red); color: var(--red); }
        .hidden { display: none !important; }

        /* MAIN */
        .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; }
        .topbar { padding: 20px 32px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--dark); position: sticky; top: 0; z-index: 50; }
        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 3px; }

        /* TABS */
        .tabs { display: flex; gap: 4px; padding: 24px 32px 0; }
        .tab { padding: 10px 20px; border-radius: 6px 6px 0 0; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; border: 1px solid transparent; border-bottom: none; transition: all 0.15s; background: transparent; }
        .tab:hover { color: var(--text); background: var(--dark2); }
        .tab.active { color: var(--text); background: var(--dark2); border-color: var(--border); border-bottom: 2px solid var(--red); }

        /* CONTENT */
        .content { background: var(--dark2); border: 1px solid var(--border); border-radius: 0 8px 8px 8px; margin: 0 32px 32px; padding: 24px; min-height: 400px; }

        /* COMMANDE CARD */
        .order-card {
            background: var(--dark3);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 16px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .order-card:hover { border-color: rgba(200,21,42,0.3); }

        .order-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            cursor: pointer;
            gap: 12px;
        }

        .order-ref {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            color: var(--red);
        }

        .order-date {
            font-size: 11px;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
        }

        .order-total {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 20px;
            color: var(--green);
            letter-spacing: 1px;
        }

        .order-original {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-dim);
            text-decoration: line-through;
        }

        /* STATUS BADGE */
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .status-attente { background: rgba(201,168,76,0.15); color: var(--gold); border: 1px solid rgba(201,168,76,0.3); }
        .status-cours { background: rgba(59,130,246,0.15); color: var(--blue); border: 1px solid rgba(59,130,246,0.3); }
        .status-preparee { background: rgba(139,92,246,0.15); color: #a78bfa; border: 1px solid rgba(139,92,246,0.3); }
        .status-terminee { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
        .status-annulee { background: rgba(200,21,42,0.15); color: #ff6b7a; border: 1px solid rgba(200,21,42,0.3); }

        /* ORDER BODY */
        .order-body { display: none; border-top: 1px solid var(--border); padding: 20px; }
        .order-body.open { display: block; }

        .order-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
        .order-table th { text-align: left; font-size: 11px; font-weight: 600; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; letter-spacing: 1px; padding: 8px 12px; border-bottom: 1px solid var(--border); text-transform: uppercase; }
        .order-table td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid rgba(42,51,71,0.5); }
        .order-table tr:last-child td { border-bottom: none; }
        .order-table .subtotal { color: var(--green); font-family: 'JetBrains Mono', monospace; text-align: right; }

        .order-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            gap: 12px;
            flex-wrap: wrap;
        }

        .order-info { font-size: 12px; color: var(--text-muted); }
        .order-info strong { color: var(--text); }

        /* DISCORD LINK */
        .btn-discord-thread {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(88,101,242,0.15);
            border: 1px solid rgba(88,101,242,0.3);
            border-radius: 6px;
            color: #7289da;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.15s;
        }
        .btn-discord-thread:hover { background: rgba(88,101,242,0.25); color: #fff; }

        /* ANNULER */
        .btn-cancel-order {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid rgba(200,21,42,0.3);
            border-radius: 6px;
            color: #ff6b7a;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-cancel-order:hover { background: rgba(200,21,42,0.1); }

        /* EMPTY */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }
        .empty-state .emoji { font-size: 48px; margin-bottom: 16px; }
        .empty-state p { font-size: 14px; margin-bottom: 20px; }
        .btn-shop { display: inline-block; padding: 10px 24px; background: var(--red); color: #fff; border-radius: 6px; font-weight: 700; font-size: 13px; text-decoration: none; transition: all 0.15s; }
        .btn-shop:hover { background: #a01020; }

        /* LOADING */
        .loading { display: flex; align-items: center; justify-content: center; padding: 60px; gap: 12px; color: var(--text-muted); font-size: 13px; }
        .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin 0.8s linear infinite; }

        /* TOAST */
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--dark3); border: 1px solid var(--border); border-radius: 8px; padding: 12px 20px; font-size: 13px; color: var(--text); z-index: 500; transition: transform 0.3s ease; white-space: nowrap; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: var(--green); }
        .toast.error { border-color: var(--red); color: #ff6b7a; }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
    <div class="sidebar-logo" style="padding:20px 16px 16px;">
        <img src="https://hannibalgta.github.io/thelostmcshop/logo.png" alt="Lost MC" style="width:160px;max-width:90%;filter:drop-shadow(0 0 16px rgba(200,21,42,0.5)) brightness(1.05);image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges;">
        <div class="sidebar-title" style="margin-top:10px;font-size:14px;letter-spacing:4px;">THE <span>LOST</span> MC SHOP</div>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-section">Navigation</div>
        <a class="nav-item" href="catalogue.html"><span class="icon">🏪</span> Catalogue</a>
        <a class="nav-item active" href="commandes.html">
            <span class="icon">📦</span> Mes Commandes
            <span class="nav-badge hidden" id="badge-commandes">0</span>
        </a>
        <a class="nav-item hidden" href="ventes.html" id="nav-ventes">
            <span class="icon">🎯</span> Gestion Ventes
            <span class="nav-badge hidden" id="badge-ventes">0</span>
        </a>
        <a class="nav-item hidden" href="admin.html" id="nav-admin">
            <span class="icon">⚙️</span> Administration
        </a>
    </nav>
    <div class="sidebar-bottom">
        <div class="user-card">
            <img class="user-avatar" id="user-avatar" src="" alt="">
            <div>
                <div class="user-name" id="user-name">—</div>
                <div class="user-role" id="user-role">CLIENT</div>
            </div>
        </div>
        <button class="btn-logout" onclick="logout()">🚪 Déconnexion</button>
    </div>
</aside>

<!-- MAIN -->
<main class="main">
    <div class="topbar">
        <div class="page-title">📦 MES COMMANDES</div>
        <a href="catalogue.html" class="btn-shop" style="font-family:'Bebas Neue',sans-serif;letter-spacing:2px;font-size:15px;">+ NOUVELLE COMMANDE</a>
    </div>

    <div class="tabs">
        <button class="tab active" id="tab-encours" onclick="switchTab('encours')">⏳ En cours</button>
        <button class="tab" id="tab-historique" onclick="switchTab('historique')">✅ Historique</button>
    </div>

    <div class="content">
        <div id="orders-list"><div class="loading"><div class="spinner"></div> Chargement...</div></div>
    </div>
</main>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://dosjkcwitjskydrcmbhj.supabase.co'
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRvc2prY3dpdGpza3lkcmNtYmhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MjM1NTAsImV4cCI6MjEwMDk5OTU1MH0.1QcwS98HHeGjR0bwmBBLb-MpRxS-gO8mZDh0eSDZ740'
const API_URL = 'https://dosjkcwitjskydrcmbhj.supabase.co/functions/v1/lostmc-api'
const GUILD_ID = '1259332285208068179'

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON)
let currentUser = null, accessToken = null, profile = null
let allOrders = [], activeTab = 'encours'

async function init() {
    const { data: { session } } = await sb.auth.getSession()
    if (!session) { window.location.href = 'index.html'; return }
    currentUser = session.user
    accessToken = session.access_token
    // Session active via sessionStorage (vide a la fermeture d'onglet)
    sessionStorage.setItem('s', '1')

    document.getElementById('user-name').textContent = currentUser.user_metadata?.full_name || '—'
    const avatar = currentUser.user_metadata?.avatar_url
    if (avatar) document.getElementById('user-avatar').src = avatar
    await loadProfile()
    await loadOrders()
    await loadNotifs()
    // Marquer les notifs statut comme lues
    callApi('mark_notifs_read', { type: 'statut' }).catch(() => {})
    setInterval(loadOrders, 60000)
    setInterval(loadNotifs, 30000)
}

async function callApi(action, payload = {}) {
    const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + accessToken, 'apikey': SUPABASE_ANON },
        body: JSON.stringify({ action, payload })
    })
    const data = await res.json()
    if (data.error) throw new Error(data.error)
    return data
}

function applyProfile(profile) {
    const role = profile.role_admin ? 'ADMIN' : profile.role_vendeur ? 'VENDEUR' : 'CLIENT'
    document.getElementById('user-role').textContent = role
    if (profile.role_vendeur || profile.role_admin) document.getElementById('nav-ventes').classList.remove('hidden')
    else document.getElementById('nav-ventes').classList.add('hidden')
    if (profile.role_admin) document.getElementById('nav-admin').classList.remove('hidden')
    else document.getElementById('nav-admin').classList.add('hidden')
}

async function loadProfile() {
    try {
        const cached = sessionStorage.getItem('profile_cache')
        if (cached) {
            const { profile: p, ts } = JSON.parse(cached)
            if (Date.now() - ts < 5 * 60 * 1000) { profile = p; applyProfile(p); return }
        }
        const data = await callApi('get_profile', {})
        profile = data.profile
        sessionStorage.setItem('profile_cache', JSON.stringify({ profile: data.profile, ts: Date.now() }))
        applyProfile(data.profile)
    } catch(e) {
        // Si accès refusé par la Edge Function (pas membre du serveur) → déconnexion
        if (e.message && (e.message.includes('refuse') || e.message.includes('refus'))) {
            await sb.auth.signOut()
            window.location.href = 'index.html'
            return
        }
        // Autre erreur réseau → fallback DB
        const{data:prof}=await sb.from('profiles').select('*').eq('id',currentUser.id).maybeSingle()
        if (prof) { profile = prof; applyProfile(prof) }
        else { await sb.auth.signOut(); window.location.href='index.html' }
    }
}

async function loadOrders() {
    const { data } = await sb.from('commandes')
        .select('*, details_commande(*)')
        .eq('client_id', currentUser.id)
        .order('date_commande', { ascending: false })
    allOrders = data || []
    renderOrders()
}

function switchTab(tab) {
    activeTab = tab
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
    document.getElementById('tab-' + tab).classList.add('active')
    renderOrders()
}

function renderOrders() {
    const encours = ['En attente', 'En cours', 'Préparée']
    const historique = ['Terminée', 'Annulée']
    const filtered = allOrders.filter(o => activeTab === 'encours' ? encours.includes(o.statut) : historique.includes(o.statut))
    const el = document.getElementById('orders-list')

    if (!filtered.length) {
        el.innerHTML = `<div class="empty-state">
            <div class="emoji">${activeTab === 'encours' ? '📭' : '📋'}</div>
            <p>${activeTab === 'encours' ? 'Aucune commande en cours' : 'Aucun historique de commande'}</p>
            ${activeTab === 'encours' ? '<a href="catalogue.html" class="btn-shop">VOIR LE CATALOGUE</a>' : ''}
        </div>`
        return
    }

    el.innerHTML = filtered.map(o => {
        const details = o.details_commande || []
        const baseTotal = details.reduce((s, d) => s + d.prix_achat * d.quantite, 0)
        const total = o.montant_ajuste ?? baseTotal
        const hasPromo = o.montant_ajuste !== null && o.montant_ajuste < baseTotal
        const statusClass = { 'En attente': 'attente', 'En cours': 'cours', 'Préparée': 'preparee', 'Terminée': 'terminee', 'Annulée': 'annulee' }[o.statut] || 'attente'
        const date = new Date(o.date_commande).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' })
        const discordThreadUrl = o.discord_thread_id ? `https://discord.com/channels/${GUILD_ID}/${o.discord_thread_id}` : null

        const canCancel = o.statut === 'En attente' && !o.vendeur_affecte

        return `<div class="order-card">
            <div class="order-header" onclick="toggleOrder('${o.id}')">
                <div>
                    <div class="order-ref">${esc(o.ref_commande || 'CMD-' + o.id)}</div>
                    <div class="order-date">${date}</div>
                </div>
                <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
                    <div style="text-align:right">
                        ${hasPromo ? `<div class="order-original">${baseTotal.toLocaleString()} $</div>` : ''}
                        <div class="order-total">${total.toLocaleString()} $</div>
                        ${o.code_promo ? `<div style="font-size:10px;color:var(--gold);font-family:'JetBrains Mono',monospace">🏷️ ${esc(o.code_promo)} -${o.taux_promo}%</div>` : ''}
                    </div>
                    <span class="status-badge status-${statusClass}">${esc(o.statut).toUpperCase()}</span>
                    <span style="color:var(--text-dim);font-size:16px">▼</span>
                </div>
            </div>
            <div class="order-body" id="body-${o.id}">
                <table class="order-table">
                    <thead><tr><th>Article</th><th>Qté</th><th style="text-align:right">Sous-total</th></tr></thead>
                    <tbody>
                        ${details.map(d => `<tr>
                            <td>${esc(d.nom_article)}</td>
                            <td>x${d.quantite}</td>
                            <td class="subtotal">${(d.prix_achat * d.quantite).toLocaleString()} $</td>
                        </tr>`).join('')}
                        <tr style="font-weight:700">
                            <td colspan="2">TOTAL</td>
                            <td class="subtotal">${total.toLocaleString()} $</td>
                        </tr>
                    </tbody>
                </table>
                <div class="order-footer">
                    <div class="order-info">
                        ${o.vendeur_affecte ? `<div>👤 Vendeur : <strong>${esc(o.vendeur_affecte)}</strong></div>` : '<div>👤 Vendeur : <strong>En attente d\'affectation</strong></div>'}
                    </div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap">
                        ${discordThreadUrl ? `<a href="${discordThreadUrl}" target="_blank" class="btn-discord-thread">💬 Suivi Discord</a>` : ''}
                        ${canCancel ? `<button class="btn-cancel-order" onclick="cancelOrder(${o.id})">✕ Annuler</button>` : ''}
                    </div>
                </div>
            </div>
        </div>`
    }).join('')
}

function toggleOrder(id) {
    const body = document.getElementById('body-' + id)
    if (body) body.classList.toggle('open')
}

async function cancelOrder(id) {
    if (!confirm('Annuler cette commande ?')) return
    try {
        await callApi('update_commande', { id, updates: { statut: 'Annulée', date_fin: new Date().toISOString() } })
        showToast('✅ Commande annulée', 'success')
        await loadOrders()
    } catch(e) { showToast('❌ ' + e.message, 'error') }
}

function esc(str) {
    if (!str) return ''
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;')
}

function showToast(msg, type = '') {
    const el = document.getElementById('toast')
    el.textContent = msg
    el.className = 'toast show ' + type
    setTimeout(() => el.className = 'toast', 3000)
}


async function loadNotifs() {
    const username = currentUser?.user_metadata?.full_name
    if (!username) return
    try {
        const { data: notifs } = await sb.from('notifications')
            .select('*').eq('login', username).eq('lu', false).eq('type', 'statut')
        const count = (notifs || []).length
        const badge = document.getElementById('badge-commandes')
        if (badge) {
            if (count > 0) { badge.textContent = count; badge.classList.remove('hidden') }
            else badge.classList.add('hidden')
        }
    } catch(e) {}
}
async function logout() { await sb.auth.signOut(); window.location.href = 'index.html' }

init()

</script>
</body>
</html>
